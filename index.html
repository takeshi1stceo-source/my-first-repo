<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>献立・買い物リスト</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #4caf50;
      --green-dark: #388e3c;
      --orange: #ff9800;
      --orange-dark: #f57c00;
      --bg: #f5f5f5;
      --card: #ffffff;
      --text: #212121;
      --sub: #757575;
      --border: #e0e0e0;
      --shadow: 0 2px 8px rgba(0,0,0,0.12);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* タブバー */
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 0; right: 0;
      background: var(--card);
      border-top: 1px solid var(--border);
      display: flex;
      z-index: 100;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .tab-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 4px 6px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 10px;
      color: var(--sub);
      gap: 3px;
      -webkit-tap-highlight-color: transparent;
    }
    .tab-btn.active { color: var(--green); }
    .tab-btn svg { width: 24px; height: 24px; }

    /* ヘッダー */
    .header {
      position: sticky;
      top: 0;
      background: var(--green);
      color: #fff;
      padding: 16px 16px 12px;
      padding-top: calc(16px + env(safe-area-inset-top));
      z-index: 50;
      box-shadow: var(--shadow);
    }
    .header h1 { font-size: 20px; font-weight: 700; }
    .header .week-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
    }
    .week-nav span { font-size: 14px; font-weight: 500; }
    .nav-btn {
      background: rgba(255,255,255,0.25);
      border: none;
      color: #fff;
      width: 32px; height: 32px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }

    /* ページ */
    .page { display: none; padding-bottom: calc(80px + env(safe-area-inset-bottom)); }
    .page.active { display: block; }

    /* 献立ページ */
    .meal-grid { padding: 12px; display: flex; flex-direction: column; gap: 10px; }

    .day-card {
      background: var(--card);
      border-radius: 14px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .day-header {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      background: var(--green);
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      gap: 8px;
    }
    .day-header.today { background: var(--orange); }
    .day-badge {
      background: rgba(255,255,255,0.3);
      border-radius: 6px;
      padding: 1px 7px;
      font-size: 12px;
      font-weight: 500;
    }

    .meal-rows { padding: 6px 0; }
    .meal-row {
      display: flex;
      align-items: center;
      padding: 8px 14px;
      border-bottom: 1px solid var(--border);
      gap: 10px;
    }
    .meal-row:last-child { border-bottom: none; }
    .meal-label {
      font-size: 11px;
      color: var(--sub);
      min-width: 32px;
      font-weight: 600;
    }
    .meal-input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 15px;
      font-family: inherit;
      background: transparent;
      color: var(--text);
    }
    .meal-input::placeholder { color: #bdbdbd; }
    .ingredient-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--green);
      padding: 4px;
      -webkit-tap-highlight-color: transparent;
    }
    .ingredient-btn svg { width: 20px; height: 20px; }

    /* 食材モーダル */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 200;
      align-items: flex-end;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--card);
      border-radius: 20px 20px 0 0;
      padding: 20px 16px;
      padding-bottom: calc(20px + env(safe-area-inset-bottom));
      width: 100%;
      max-height: 75vh;
      overflow-y: auto;
      animation: slideUp 0.25s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .modal-title {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-close {
      background: none;
      border: none;
      font-size: 22px;
      color: var(--sub);
      cursor: pointer;
      line-height: 1;
    }
    .ingredient-input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .ingredient-text {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
    }
    .ingredient-text:focus { border-color: var(--green); }
    .add-btn {
      background: var(--green);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .ingredient-list { display: flex; flex-direction: column; gap: 8px; }
    .ingredient-item {
      display: flex;
      align-items: center;
      background: var(--bg);
      border-radius: 10px;
      padding: 10px 12px;
      gap: 10px;
    }
    .ingredient-item span { flex: 1; font-size: 15px; }
    .remove-btn {
      background: none;
      border: none;
      color: #ef5350;
      font-size: 20px;
      cursor: pointer;
      line-height: 1;
      padding: 0 4px;
    }

    /* 買い物リストページ */
    .shop-header-actions {
      display: flex;
      gap: 8px;
      padding: 12px;
    }
    .action-btn {
      flex: 1;
      padding: 11px 8px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .action-btn.primary { background: var(--green); color: #fff; }
    .action-btn.secondary { background: var(--card); color: var(--green); border: 1px solid var(--green); }
    .action-btn.danger { background: var(--card); color: #ef5350; border: 1px solid #ef5350; }

    .shop-add-row {
      display: flex;
      gap: 8px;
      padding: 0 12px 12px;
    }
    .shop-input {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 14px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      background: var(--card);
    }
    .shop-input:focus { border-color: var(--green); }
    .shop-add-btn {
      background: var(--green);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 11px 18px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .shop-list { padding: 0 12px; display: flex; flex-direction: column; gap: 8px; }

    .shop-category {
      background: var(--card);
      border-radius: 14px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .category-header {
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 700;
      color: var(--sub);
      background: var(--bg);
      letter-spacing: 0.05em;
    }

    .shop-item {
      display: flex;
      align-items: center;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      gap: 12px;
      transition: background 0.15s;
    }
    .shop-item:last-child { border-bottom: none; }
    .shop-item.done { background: #f9f9f9; }
    .shop-checkbox {
      width: 24px; height: 24px;
      border: 2px solid var(--border);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.15s;
    }
    .shop-item.done .shop-checkbox {
      background: var(--green);
      border-color: var(--green);
    }
    .shop-item-name {
      flex: 1;
      font-size: 15px;
      transition: color 0.15s;
    }
    .shop-item.done .shop-item-name {
      color: var(--sub);
      text-decoration: line-through;
    }
    .shop-item-del {
      background: none;
      border: none;
      color: #bdbdbd;
      font-size: 20px;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }

    .empty-msg {
      text-align: center;
      padding: 40px 20px;
      color: var(--sub);
      font-size: 15px;
    }
    .empty-msg .icon { font-size: 48px; margin-bottom: 12px; }

    /* メモページ */
    .memo-page { padding: 12px; }
    .memo-card {
      background: var(--card);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 14px;
    }
    .memo-card h3 { font-size: 15px; font-weight: 700; margin-bottom: 10px; }
    .memo-textarea {
      width: 100%;
      min-height: 200px;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      font-size: 15px;
      font-family: inherit;
      resize: vertical;
      outline: none;
      line-height: 1.6;
    }
    .memo-textarea:focus { border-color: var(--green); }
    .save-btn {
      width: 100%;
      margin-top: 10px;
      padding: 13px;
      background: var(--green);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .toast {
      position: fixed;
      bottom: calc(90px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #323232;
      color: #fff;
      padding: 10px 20px;
      border-radius: 24px;
      font-size: 14px;
      z-index: 300;
      opacity: 0;
      transition: all 0.3s;
      pointer-events: none;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<!-- ヘッダー -->
<div class="header" id="mainHeader">
  <h1>🍽 献立・買い物リスト</h1>
  <div class="week-nav">
    <button class="nav-btn" onclick="changeWeek(-1)">‹</button>
    <span id="weekLabel"></span>
    <button class="nav-btn" onclick="changeWeek(1)">›</button>
  </div>
</div>

<!-- 献立ページ -->
<div class="page active" id="page-meal">
  <div class="meal-grid" id="mealGrid"></div>
</div>

<!-- 買い物リストページ -->
<div class="page" id="page-shop">
  <div class="shop-header-actions">
    <button class="action-btn primary" onclick="importFromMeals()">📥 献立から取込</button>
    <button class="action-btn secondary" onclick="clearDone()">✓ 済みを削除</button>
    <button class="action-btn danger" onclick="clearAll()">🗑 全削除</button>
  </div>
  <div class="shop-add-row">
    <input class="shop-input" id="shopInput" placeholder="食材を追加..." onkeydown="if(event.key==='Enter')addShopItem()">
    <button class="shop-add-btn" onclick="addShopItem()">追加</button>
  </div>
  <div class="shop-list" id="shopList"></div>
</div>

<!-- メモページ -->
<div class="page" id="page-memo">
  <div class="memo-page">
    <div class="memo-card">
      <h3>📝 メモ</h3>
      <textarea class="memo-textarea" id="memoText" placeholder="買い物メモ、食事の注意事項など自由にメモできます..."></textarea>
      <button class="save-btn" onclick="saveMemo()">保存</button>
    </div>
  </div>
</div>

<!-- タブバー -->
<div class="tab-bar">
  <button class="tab-btn active" id="tab-meal" onclick="switchTab('meal')">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 9H9V2H7v7H5V2H3v7c0 2.12 1.66 3.84 3.75 3.97V22h2.5v-9.03C11.34 12.84 13 11.12 13 9V2h-2v7zm5-3v8h2.5v8H21V2c-2.76 0-5 2.24-5 4z"/></svg>
    献立
  </button>
  <button class="tab-btn" id="tab-shop" onclick="switchTab('shop')">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 6h-2c0-2.76-2.24-5-5-5S7 3.24 7 6H5c-1.1 0-1.99.9-1.99 2L3 20c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-7-3c1.66 0 3 1.34 3 3H9c0-1.66 1.34-3 3-3zm0 10c-1.66 0-3-1.34-3-3h2c0 .55.45 1 1 1s1-.45 1-1h2c0 1.66-1.34 3-3 3z"/></svg>
    買い物
  </button>
  <button class="tab-btn" id="tab-memo" onclick="switchTab('memo')">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
    メモ
  </button>
</div>

<!-- 食材モーダル -->
<div class="modal-overlay" id="ingredientModal" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-title">
      <span id="modalTitle">食材を登録</span>
      <button class="modal-close" onclick="closeModalDirect()">×</button>
    </div>
    <div class="ingredient-input-row">
      <input class="ingredient-text" id="ingredientInput" placeholder="食材名（例: 鶏肉、玉ねぎ）" onkeydown="if(event.key==='Enter')addIngredient()">
      <button class="add-btn" onclick="addIngredient()">追加</button>
    </div>
    <div class="ingredient-list" id="ingredientList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const DAYS = ['月','火','水','木','金','土','日'];
const MEALS = ['夜'];

let state = {
  weekOffset: 0,
  meals: {},       // { 'YYYY-Www': { 'Mon_朝': { name, ingredients:[] } } }
  shopItems: [],   // { id, name, done, category }
  memo: ''
};

let currentModalKey = null;

// === 初期化 ===
function init() {
  loadState();
  renderWeekLabel();
  renderMealGrid();
  renderShopList();
  document.getElementById('memoText').value = state.memo;
}

function getWeekKey(offset = 0) {
  const d = new Date();
  d.setDate(d.getDate() + offset * 7);
  const jan1 = new Date(d.getFullYear(), 0, 1);
  const week = Math.ceil(((d - jan1) / 86400000 + jan1.getDay() + 1) / 7);
  return `${d.getFullYear()}-W${String(week).padStart(2,'0')}`;
}

function getWeekDates(offset = 0) {
  const today = new Date();
  const day = today.getDay();
  const monday = new Date(today);
  monday.setDate(today.getDate() - (day === 0 ? 6 : day - 1) + offset * 7);
  return DAYS.map((_, i) => {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    return d;
  });
}

function renderWeekLabel() {
  const dates = getWeekDates(state.weekOffset);
  const fmt = d => `${d.getMonth()+1}/${d.getDate()}`;
  document.getElementById('weekLabel').textContent = `${fmt(dates[0])} 〜 ${fmt(dates[6])}`;
}

function changeWeek(delta) {
  state.weekOffset += delta;
  saveState();
  renderWeekLabel();
  renderMealGrid();
}

// === 献立グリッド ===
function getMealKey(dateStr, meal) {
  return `${dateStr}_${meal}`;
}

function renderMealGrid() {
  const grid = document.getElementById('mealGrid');
  const dates = getWeekDates(state.weekOffset);
  const weekKey = getWeekKey(state.weekOffset);
  const todayStr = new Date().toISOString().slice(0, 10);

  if (!state.meals[weekKey]) state.meals[weekKey] = {};

  grid.innerHTML = dates.map((date, di) => {
    const dateStr = date.toISOString().slice(0, 10);
    const isToday = dateStr === todayStr;
    const dayName = `${DAYS[di]}曜日`;
    const dateFmt = `${date.getMonth()+1}/${date.getDate()}`;

    const mealRows = MEALS.map(meal => {
      const key = getMealKey(dateStr, meal);
      const entry = state.meals[weekKey][key] || { name: '', ingredients: [] };
      const ingCount = entry.ingredients ? entry.ingredients.length : 0;
      const escKey = key.replace(/'/g, "\\'");
      return `
        <div class="meal-row">
          <span class="meal-label">${meal}食</span>
          <input class="meal-input"
            placeholder="${meal === '朝' ? '例: トースト' : meal === '昼' ? '例: パスタ' : '例: 肉じゃが'}"
            value="${escHtml(entry.name)}"
            onchange="saveMealName('${weekKey}','${escKey}', this.value)"
            oninput="saveMealName('${weekKey}','${escKey}', this.value)">
          <button class="ingredient-btn" onclick="openModal('${weekKey}','${escKey}','${escHtml(entry.name || meal+'食')}')" title="食材">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              ${ingCount > 0
                ? `<text x="12" y="16" text-anchor="middle" font-size="10" fill="currentColor" stroke="none">${ingCount}</text>`
                : `<line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/>`}
            </svg>
          </button>
        </div>`;
    }).join('');

    return `
      <div class="day-card">
        <div class="day-header ${isToday ? 'today' : ''}">
          <span>${dayName}</span>
          <span class="day-badge">${dateFmt}</span>
          ${isToday ? '<span class="day-badge">今日</span>' : ''}
        </div>
        <div class="meal-rows">${mealRows}</div>
      </div>`;
  }).join('');
}

function saveMealName(weekKey, key, value) {
  if (!state.meals[weekKey]) state.meals[weekKey] = {};
  if (!state.meals[weekKey][key]) state.meals[weekKey][key] = { name: '', ingredients: [] };
  state.meals[weekKey][key].name = value;
  saveState();
}

function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// === 食材モーダル ===
function openModal(weekKey, mealKey, label) {
  currentModalKey = { weekKey, mealKey };
  if (!state.meals[weekKey]) state.meals[weekKey] = {};
  if (!state.meals[weekKey][mealKey]) state.meals[weekKey][mealKey] = { name: '', ingredients: [] };

  document.getElementById('modalTitle').textContent = `食材: ${label}`;
  document.getElementById('ingredientInput').value = '';
  renderIngredientList();
  document.getElementById('ingredientModal').classList.add('open');
  setTimeout(() => document.getElementById('ingredientInput').focus(), 300);
}

function closeModal(e) {
  if (e.target === document.getElementById('ingredientModal')) closeModalDirect();
}
function closeModalDirect() {
  document.getElementById('ingredientModal').classList.remove('open');
  currentModalKey = null;
  renderMealGrid();
}

function addIngredient() {
  const input = document.getElementById('ingredientInput');
  const val = input.value.trim();
  if (!val || !currentModalKey) return;
  const { weekKey, mealKey } = currentModalKey;
  if (!state.meals[weekKey][mealKey].ingredients) state.meals[weekKey][mealKey].ingredients = [];
  state.meals[weekKey][mealKey].ingredients.push(val);
  input.value = '';
  saveState();
  renderIngredientList();
}

function removeIngredient(idx) {
  if (!currentModalKey) return;
  const { weekKey, mealKey } = currentModalKey;
  state.meals[weekKey][mealKey].ingredients.splice(idx, 1);
  saveState();
  renderIngredientList();
}

function renderIngredientList() {
  if (!currentModalKey) return;
  const { weekKey, mealKey } = currentModalKey;
  const ingredients = state.meals[weekKey][mealKey].ingredients || [];
  const el = document.getElementById('ingredientList');
  if (ingredients.length === 0) {
    el.innerHTML = '<p style="color:#bdbdbd;font-size:14px;text-align:center;padding:12px">まだ食材がありません</p>';
    return;
  }
  el.innerHTML = ingredients.map((ing, i) => `
    <div class="ingredient-item">
      <span>${escHtml(ing)}</span>
      <button class="remove-btn" onclick="removeIngredient(${i})">×</button>
    </div>`).join('');
}

// === 買い物リスト ===
function importFromMeals() {
  const weekKey = getWeekKey(state.weekOffset);
  const week = state.meals[weekKey] || {};
  const existing = new Set(state.shopItems.map(i => i.name));
  let count = 0;

  Object.values(week).forEach(entry => {
    if (entry.ingredients) {
      entry.ingredients.forEach(ing => {
        if (!existing.has(ing)) {
          state.shopItems.push({ id: Date.now() + Math.random(), name: ing, done: false });
          existing.add(ing);
          count++;
        }
      });
    }
  });

  saveState();
  renderShopList();
  showToast(count > 0 ? `${count}件の食材を取込みました` : '新しい食材はありませんでした');
}

function addShopItem() {
  const input = document.getElementById('shopInput');
  const val = input.value.trim();
  if (!val) return;
  state.shopItems.push({ id: Date.now(), name: val, done: false });
  input.value = '';
  saveState();
  renderShopList();
}

function toggleShopItem(id) {
  const item = state.shopItems.find(i => i.id === id);
  if (item) item.done = !item.done;
  saveState();
  renderShopList();
}

function deleteShopItem(id) {
  state.shopItems = state.shopItems.filter(i => i.id !== id);
  saveState();
  renderShopList();
}

function clearDone() {
  const count = state.shopItems.filter(i => i.done).length;
  state.shopItems = state.shopItems.filter(i => !i.done);
  saveState();
  renderShopList();
  showToast(`${count}件を削除しました`);
}

function clearAll() {
  if (state.shopItems.length === 0) return;
  if (!confirm('買い物リストを全て削除しますか？')) return;
  state.shopItems = [];
  saveState();
  renderShopList();
  showToast('リストをクリアしました');
}

function renderShopList() {
  const el = document.getElementById('shopList');
  const items = state.shopItems;

  if (items.length === 0) {
    el.innerHTML = '<div class="empty-msg"><div class="icon">🛒</div>食材を追加するか<br>献立から取込みましょう</div>';
    return;
  }

  const pending = items.filter(i => !i.done);
  const done = items.filter(i => i.done);

  const renderItems = list => list.map(item => `
    <div class="shop-item ${item.done ? 'done' : ''}" onclick="toggleShopItem(${item.id})">
      <div class="shop-checkbox">
        ${item.done ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="white"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>' : ''}
      </div>
      <span class="shop-item-name">${escHtml(item.name)}</span>
      <button class="shop-item-del" onclick="event.stopPropagation();deleteShopItem(${item.id})">×</button>
    </div>`).join('');

  let html = '';
  if (pending.length > 0) {
    html += `<div class="shop-category">
      <div class="category-header">未購入 (${pending.length}件)</div>
      ${renderItems(pending)}
    </div>`;
  }
  if (done.length > 0) {
    html += `<div class="shop-category">
      <div class="category-header">購入済み (${done.length}件)</div>
      ${renderItems(done)}
    </div>`;
  }

  el.innerHTML = html;
}

// === メモ ===
function saveMemo() {
  state.memo = document.getElementById('memoText').value;
  saveState();
  showToast('メモを保存しました');
}

// === タブ ===
function switchTab(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(`page-${name}`).classList.add('active');
  document.getElementById(`tab-${name}`).classList.add('active');

  const header = document.getElementById('mainHeader');
  if (name === 'meal') {
    header.style.display = 'block';
  } else {
    header.style.display = 'none';
  }
}

// === ストレージ ===
function saveState() {
  try { localStorage.setItem('kondate_app', JSON.stringify(state)); } catch(e) {}
}

function loadState() {
  try {
    const s = localStorage.getItem('kondate_app');
    if (s) {
      const loaded = JSON.parse(s);
      state = { ...state, ...loaded };
    }
  } catch(e) {}
}

// === トースト ===
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}

init();
</script>
</body>
</html>

<body>
<div class="container">
  <h1>🍽️ 晩御飯 献立表</h1>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('week')"><i class="ti ti-calendar"></i> 週間献立</button>
    <button class="tab" onclick="switchTab('shopping')"><i class="ti ti-shopping-cart"></i> 買い物リスト</button>
    <button class="tab" onclick="switchTab('month')"><i class="ti ti-calendar-month"></i> 月別ビュー</button>
  </div>
  <div id="tab-week" class="section active">
    <div class="week-nav">
      <button onclick="changeWeek(-1)"><i class="ti ti-chevron-left"></i></button>
      <span class="week-label" id="week-label"></span>
      <button onclick="changeWeek(1)"><i class="ti ti-chevron-right"></i></button>
    </div>
    <div class="week-grid" id="week-grid"></div>
    <div class="btn-row">
      <button class="save-btn" onclick="saveWeek()"><i class="ti ti-device-floppy"></i> 保存</button>
      <button class="primary-btn" onclick="generateShopping()"><i class="ti ti-list"></i> 買い物リスト生成</button>
    </div>
  </div>
  <div id="tab-shopping" class="section">
    <div class="section-label">今週の買い物リスト</div>
    <div class="shopping-list" id="shopping-list"></div>
    <div class="add-item">
      <input type="text" id="add-item-input" placeholder="食材を追加..." onkeydown="if(event.key==='Enter')addShoppingItem()" />
      <button class="save-btn" onclick="addShoppingItem()"><i class="ti ti-plus"></i> 追加</button>
    </div>
    <div class="btn-row">
      <button class="save-btn" onclick="clearChecked()">チェック済みを削除</button>
      <button class="save-btn" onclick="clearAllShopping()">全て削除</button>
    </div>
  </div>
  <div id="tab-month" class="section">
    <div class="month-nav">
      <button class="save-btn" onclick="changeMonth(-1)"><i class="ti ti-chevron-left"></i></button>
      <span class="month-label" id="month-label"></span>
      <button class="save-btn" onclick="changeMonth(1)"><i class="ti ti-chevron-right"></i></button>
    </div>
    <div class="month-grid" id="month-grid"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const DAYS = ['月','火','水','木','金','土','日'];
const MONTHS = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
let allData = JSON.parse(localStorage.getItem('kondate-data') || '{}');
let shoppingItems = JSON.parse(localStorage.getItem('kondate-shopping') || '[]');
let currentWeekOffset = 0;
let currentMonth = new Date().getMonth();
let currentYear = new Date().getFullYear();
function getWeekStart(offset) {
  const d = new Date();
  const day = d.getDay();
  const diff = (day === 0 ? -6 : 1 - day);
  d.setDate(d.getDate() + diff + offset * 7);
  d.setHours(0,0,0,0);
  return d;
}
function dateKey(d) { return d.toISOString().slice(0,10); }
function fmtDate(d) { return (d.getMonth()+1) + '/' + d.getDate(); }
function renderWeek() {
  const start = getWeekStart(currentWeekOffset);
  const end = new Date(start); end.setDate(start.getDate()+6);
  document.getElementById('week-label').textContent = currentYear + '年 ' + fmtDate(start) + ' 〜 ' + fmtDate(end);
  const grid = document.getElementById('week-grid');
  grid.innerHTML = '';
  for (let i = 0; i < 7; i++) {
    const d = new Date(start); d.setDate(start.getDate()+i);
    const key = dateKey(d);
    const val = allData[key] || '';
    const card = document.createElement('div');
    card.className = 'day-card';
    card.innerHTML = `<div class="day-name">${DAYS[i]}<br>${fmtDate(d)}</div><textarea class="day-input" id="meal-${key}" placeholder="献立を入力">${val}</textarea>`;
    grid.appendChild(card);
  }
}
function changeWeek(dir) { currentWeekOffset += dir; renderWeek(); }
function saveWeek() {
  const start = getWeekStart(currentWeekOffset);
  for (let i = 0; i < 7; i++) {
    const d = new Date(start); d.setDate(start.getDate()+i);
    const key = dateKey(d);
    const el = document.getElementById('meal-'+key);
    if (el) allData[key] = el.value;
  }
  localStorage.setItem('kondate-data', JSON.stringify(allData));
  showToast('保存しました！');
}
const recipeMap = {
  'カレー':['玉ねぎ','じゃがいも','にんじん','カレールー','鶏肉'],
  '肉じゃが':['じゃがいも','玉ねぎ','牛肉','しらたき','醤油','みりん'],
  'から揚げ':['鶏もも肉','醤油','生姜','片栗粉','にんにく'],
  'ハンバーグ':['合い挽き肉','玉ねぎ','卵','パン粉','ケチャップ'],
  '肉野菜炒め':['豚肉','もやし','キャベツ','にら','醤油'],
  'パスタ':['パスタ','トマト缶','玉ねぎ','ベーコン','にんにく'],
  '餃子':['豚ひき肉','キャベツ','にら','餃子の皮','にんにく'],
  '豚汁':['豚肉','大根','にんじん','こんにゃく','味噌'],
  '麻婆豆腐':['豆腐','豚ひき肉','豆板醤','甜麺醤','にんにく'],
  '鮭の塩焼き':['鮭','塩','レモン'],
  '煮魚':['魚','醤油','みりん','生姜','砂糖'],
  '天ぷら':['えび','なす','かぼちゃ','薄力粉','卵'],
  '野菜炒め':['もやし','キャベツ','にんじん','ピーマン','醤油'],
  '酢豚':['豚肉','玉ねぎ','ピーマン','にんじん','酢','醤油'],
  '炒飯':['ご飯','卵','ねぎ','醤油','ごま油'],
  'オムライス':['ご飯','卵','鶏肉','玉ねぎ','ケチャップ'],
  'お好み焼き':['キャベツ','豚肉','卵','薄力粉','だし'],
  'すき焼き':['牛肉','豆腐','ねぎ','白菜','醤油','みりん'],
  '鍋':['白菜','豆腐','えのき','豚肉','ポン酢'],
  'シチュー':['鶏肉','じゃがいも','にんじん','玉ねぎ','シチュールー'],
  '唐揚げ':['鶏もも肉','醤油','生姜','片栗粉','にんにく'],
  'みそ汁':['豆腐','わかめ','ねぎ','味噌','だし'],
  '炊き込みご飯':['米','鶏肉','ごぼう','にんじん','醤油'],
  'グラタン':['鶏肉','マカロニ','玉ねぎ','牛乳','チーズ'],
};
function generateShopping() {
  saveWeek();
  const start = getWeekStart(currentWeekOffset);
  const found = new Set();
  for (let i = 0; i < 7; i++) {
    const d = new Date(start); d.setDate(start.getDate()+i);
    const meal = allData[dateKey(d)] || '';
    if (!meal.trim()) continue;
    let matched = false;
    for (const [dish, items] of Object.entries(recipeMap)) {
      if (meal.includes(dish)) { items.forEach(it => found.add(it)); matched = true; }
    }
    if (!matched && meal.trim()) found.add(meal.trim() + '（食材を確認）');
  }
  if (found.size === 0) { showToast('献立を入力してから生成してください'); return; }
  shoppingItems = Array.from(found).map(name => ({ name, checked: false }));
  localStorage.setItem('kondate-shopping', JSON.stringify(shoppingItems));
  renderShopping();
  switchTab('shopping');
  showToast('買い物リストを生成しました！');
}
function renderShopping() {
  const list = document.getElementById('shopping-list');
  if (shoppingItems.length === 0) { list.innerHTML = '<div class="empty-msg">買い物リストは空です。<br>週間献立から生成してください。</div>'; return; }
  list.innerHTML = shoppingItems.map((item, i) =>
    `<div class="shopping-item${item.checked?' checked':''}">
      <input type="checkbox" ${item.checked?'checked':''} onchange="toggleItem(${i})" />
      <span class="item-name">${item.name}</span>
      <button class="remove-btn" onclick="removeItem(${i})"><i class="ti ti-x"></i></button>
    </div>`).join('');
}
function toggleItem(i) { shoppingItems[i].checked = !shoppingItems[i].checked; localStorage.setItem('kondate-shopping', JSON.stringify(shoppingItems)); renderShopping(); }
function removeItem(i) { shoppingItems.splice(i, 1); localStorage.setItem('kondate-shopping', JSON.stringify(shoppingItems)); renderShopping(); }
function addShoppingItem() {
  const input = document.getElementById('add-item-input');
  const val = input.value.trim();
  if (!val) return;
  shoppingItems.push({ name: val, checked: false });
  input.value = '';
  localStorage.setItem('kondate-shopping', JSON.stringify(shoppingItems));
  renderShopping();
}
function clearChecked() { shoppingItems = shoppingItems.filter(it => !it.checked); localStorage.setItem('kondate-shopping', JSON.stringify(shoppingItems)); renderShopping(); }
function clearAllShopping() { if (!confirm('全ての買い物リストを削除しますか？')) return; shoppingItems = []; localStorage.setItem('kondate-shopping', JSON.stringify(shoppingItems)); renderShopping(); }
function renderMonth() {
  document.getElementById('month-label').textContent = currentYear + '年 ' + MONTHS[currentMonth];
  const grid = document.getElementById('month-grid');
  grid.innerHTML = DAYS.map(d => `<div class="month-header">${d}</div>`).join('');
  const firstDay = new Date(currentYear, currentMonth, 1);
  let startDow = firstDay.getDay();
  startDow = startDow === 0 ? 6 : startDow - 1;
  for (let i = 0; i < startDow; i++) grid.innerHTML += '<div class="month-cell empty"></div>';
  const daysInMonth = new Date(currentYear, currentMonth+1, 0).getDate();
  for (let d = 1; d <= daysInMonth; d++) {
    const date = new Date(currentYear, currentMonth, d);
    const key = dateKey(date);
    const meal = allData[key] || '';
    grid.innerHTML += `<div class="month-cell"><div class="month-date">${d}</div><div class="month-meal">${meal}</div></div>`;
  }
}
function changeMonth(dir) {
  currentMonth += dir;
  if (currentMonth < 0) { currentMonth = 11; currentYear--; }
  if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  renderMonth();
}
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i) => { t.classList.toggle('active', ['week','shopping','month'][i] === tab); });
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  if (tab === 'month') renderMonth();
  if (tab === 'shopping') renderShopping();
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
renderWeek();
renderShopping();
</script>
</body>
</html>

  </div>

  </div>
</div>

  <div class="month-nav">
    <button class="nav-btn" onclick="changeMonth(-1)">‹</button>
    <span class="month-label" id="month-label"></span>
    <button class="nav-btn" onclick="changeMonth(1)">›</button>

const DAYS = ['月','火','水','木','金','土','日'];
const MONTHS = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
let allData = JSON.parse(localStorage.getItem('kondate-data') || '{}');
let shoppingItems = JSON.parse(localStorage.getItem('kondate-shopping') || '[]');
let currentWeekOffset = 0;
let currentMonth = new Date().getMonth();
let currentYear = new Date().getFullYear();

function getWeekStart(offset) {
  const d = new Date();
  const day = d.getDay();
  const diff = (day === 0 ? -6 : 1 - day);
  d.setDate(d.getDate() + diff + offset * 7);
  d.setHours(0,0,0,0);
  return d;
}
function dateKey(d) { return d.toISOString().slice(0,10); }
function fmtDate(d) { return (d.getMonth()+1) + '/' + d.getDate(); }

function renderWeek() {
  const start = getWeekStart(currentWeekOffset);
  const end = new Date(start); end.setDate(start.getDate()+6);
  document.getElementById('week-label').textContent = fmtDate(start) + ' 〜 ' + fmtDate(end);
  const grid = document.getElementById('week-grid');
  grid.innerHTML = '';
  for (let i = 0; i < 7; i++) {
    const d = new Date(start); d.setDate(start.getDate()+i);
    const key = dateKey(d);
    const val = allData[key] || '';
    const card = document.createElement('div');
    card.className = 'day-card';
    card.innerHTML = `<div class="day-name">${DAYS[i]}<br><span style="font-weight:400;font-size:11px;color:#999">${fmtDate(d)}</span></div>
      <input class="day-input" id="meal-${key}" placeholder="献立を入力" value="${val}" />`;
    grid.appendChild(card);
  }
}
function changeWeek(dir) { currentWeekOffset += dir; renderWeek(); }

function saveWeek() {
  const start = getWeekStart(currentWeekOffset);
  for (let i = 0; i < 7; i++) {
    const d = new Date(start); d.setDate(start.getDate()+i);
    const key = dateKey(d);
    const el = document.getElementById('meal-'+key);
    if (el) allData[key] = el.value;
  }
  localStorage.setItem('kondate-data', JSON.stringify(allData));
  showToast('保存しました！');
}

const recipeMap = {
  'カレー':['玉ねぎ','じゃがいも','にんじん','カレールー','鶏肉'],
  '肉じゃが':['じゃがいも','玉ねぎ','牛肉','しらたき','醤油','みりん'],
  'から揚げ':['鶏もも肉','醤油','生姜','片栗粉','にんにく'],
  'ハンバーグ':['合い挽き肉','玉ねぎ','卵','パン粉','ケチャップ'],
  '肉野菜炒め':['豚肉','もやし','キャベツ','にら','醤油'],
  'パスタ':['パスタ','トマト缶','玉ねぎ','ベーコン','にんにく'],
  '餃子':['豚ひき肉','キャベツ','にら','餃子の皮','にんにく'],
  '豚汁':['豚肉','大根','にんじん','こんにゃく','味噌'],
  '麻婆豆腐':['豆腐','豚ひき肉','豆板醤','甜麺醤','にんにく'],
  '鮭の塩焼き':['鮭','塩','レモン'],
  '煮魚':['魚','醤油','みりん','生姜','砂糖'],
  '天ぷら':['えび','なす','かぼちゃ','薄力粉','卵'],
  '野菜炒め':['もやし','キャベツ','にんじん','ピーマン','醤油'],
  '酢豚':['豚肉','玉ねぎ','ピーマン','にんじん','酢','醤油'],
  '炒飯':['ご飯','卵','ねぎ','醤油','ごま油'],
  'オムライス':['ご飯','卵','鶏肉','玉ねぎ','ケチャップ'],
  'お好み焼き':['キャベツ','豚肉','卵','薄力粉','だし'],
  'すき焼き':['牛肉','豆腐','ねぎ','白菜','醤油','みりん'],
  '鍋':['白菜','豆腐','えのき','豚肉','ポン酢'],
  'シチュー':['鶏肉','じゃがいも','にんじん','玉ねぎ','シチュールー'],
  '唐揚げ':['鶏もも肉','醤油','生姜','片栗粉','にんにく'],
  'みそ汁':['豆腐','わかめ','ねぎ','味噌','だし'],
  '炊き込みご飯':['米','鶏肉','ごぼう','にんじん','醤油'],
  'グラタン':['鶏肉','マカロニ','玉ねぎ','牛乳','チーズ'],
};

function generateShopping() {
  saveWeek();
  const start = getWeekStart(currentWeekOffset);
  const found = new Set();
  for (let i = 0; i < 7; i++) {
    const d = new Date(start); d.setDate(start.getDate()+i);
    const meal = allData[dateKey(d)] || '';
    if (!meal.trim()) continue;
    let matched = false;
    for (const [dish, items] of Object.entries(recipeMap)) {
      if (meal.includes(dish)) { items.forEach(it => found.add(it)); matched = true; }
    }
    if (!matched) found.add(meal.trim() + '（食材を確認）');
  }
  if (found.size === 0) { showToast('献立を入力してから生成してください'); return; }
  shoppingItems = Array.from(found).map(name => ({ name, checked: false }));
  localStorage.setItem('kondate-shopping', JSON.stringify(shoppingItems));
  renderShopping();
  switchTab('shopping');
  showToast('買い物リストを生成しました！');
}

function removeItem(i) { shoppingItems.splice(i, 1); localStorage.setItem('kondate-shopping', JSON.stringify(shoppingItems)); renderShopping(); }
function addShoppingItem() {
  const input = document.getElementById('add-item-input');
  const val = input.value.trim();
  if (!val) return;
  shoppingItems.push({ name: val, checked: false });
  input.value = '';
  localStorage.setItem('kondate-shopping', JSON.stringify(shoppingItems));
  renderShopping();
}
function clearChecked() { shoppingItems = shoppingItems.filter(it => !it.checked); localStorage.setItem('kondate-shopping', JSON.stringify(shoppingItems)); renderShopping(); }
function clearAllShopping() { if (!confirm('全て削除しますか？')) return; shoppingItems = []; localStorage.setItem('kondate-shopping', JSON.stringify(shoppingItems)); renderShopping(); }

function renderMonth() {
  document.getElementById('month-label').textContent = currentYear + '年 ' + MONTHS[currentMonth];
  const grid = document.getElementById('month-grid');
  grid.innerHTML = DAYS.map(d => `<div class="month-header">${d}</div>`).join('');
  const firstDay = new Date(currentYear, currentMonth, 1);
  let startDow = firstDay.getDay();
  startDow = startDow === 0 ? 6 : startDow - 1;
  for (let i = 0; i < startDow; i++) grid.innerHTML += '<div class="month-cell empty"></div>';
  const daysInMonth = new Date(currentYear, currentMonth+1, 0).getDate();
  for (let d = 1; d <= daysInMonth; d++) {
    const date = new Date(currentYear, currentMonth, d);
    const key = dateKey(date);
    const meal = allData[key] || '';
    grid.innerHTML += `<div class="month-cell"><div class="month-date">${d}</div><div class="month-meal">${meal}</div></div>`;
  }
}
function changeMonth(dir) {
  currentMonth += dir;
  if (currentMonth < 0) { currentMonth = 11; currentYear--; }
  if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  renderMonth();
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i) => {
    t.classList.toggle('active', ['week','shopping','month'][i] === tab);
  });
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  if (tab === 'month') renderMonth();
  if (tab === 'shopping') renderShopping();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

renderWeek();
renderShopping();
</script>
